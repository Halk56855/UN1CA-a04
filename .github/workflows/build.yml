name: Build BROM Port + UN1CA & ExtremeROM

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-modded-port:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Clone UN1CA and ExtremeROM
        run: |
          git clone --depth=1 https://github.com/salvogiangri/UN1CA.git unica_src
          git clone --depth=1 https://github.com/ExtremeXT/ExtremeROM.git extremerom_src

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a || true

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg curl unzip zip wget rsync \
            erofs-utils f2fs-tools android-sdk-libsparse-utils \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp xmlstarlet python3
          sudo apt install -yq linux-modules-extra-azure || true
          sudo modprobe erofs || true
          sudo modprobe f2fs || true

      - name: Download & Extract BROM_v1.5_a04.zip
        run: |
          mkdir -p work/rom_extracted work/out
          curl -L "https://pixeldrain.com/api/file/M1NWfdaM?download" -o work/BROM_v1.5_a04.zip
          unzip -q work/BROM_v1.5_a04.zip -d work/rom_extracted

      - name: Unpack System, Product & System_ext Images
        run: |
          cd work
          for part in system product system_ext; do
            if [ -f "rom_extracted/${part}.img" ]; then
              simg2img "rom_extracted/${part}.img" "${part}_raw.img" 2>/dev/null || cp "rom_extracted/${part}.img" "${part}_raw.img"
              if fsck.erofs --extract="extracted_${part}" "${part}_raw.img" 2>/dev/null; then
                echo "Extracted ${part} (EROFS)"
              else
                mkdir -p "mnt_${part}" "extracted_${part}"
                sudo mount -o loop,ro "${part}_raw.img" "mnt_${part}"
                sudo cp -a "mnt_${part}/." "extracted_${part}/"
                sudo umount "mnt_${part}"
                echo "Extracted ${part} (EXT4/F2FS)"
              fi
            fi
          done

      - name: Apply UN1CA & ExtremeROM Mods
        run: |
          ROOT_DIR=$(pwd)
          cd work

          SYS_DIR=$([ -d "extracted_system/system" ] && echo "extracted_system/system" || echo "extracted_system")
          PROD_DIR="extracted_product"
          SYSEXT_DIR="extracted_system_ext"

          # دمج ملفات التعديلات والـ overlays من salvogiangri/UN1CA
          if [ -d "$ROOT_DIR/unica_src" ]; then
            find "$ROOT_DIR/unica_src" -type d -name "overlay" | while read -r ov_dir; do
              sudo rsync -a "$ov_dir/" "$PROD_DIR/overlay/" 2>/dev/null || true
            done
            for mod_dir in "$ROOT_DIR/unica_src/unica/mods"/* "$ROOT_DIR/unica_src/target"/*; do
              [ -d "$mod_dir/system" ] && sudo rsync -a "$mod_dir/system/" "$SYS_DIR/"
              [ -d "$mod_dir/product" ] && sudo rsync -a "$mod_dir/product/" "$PROD_DIR/"
              [ -d "$mod_dir/system_ext" ] && sudo rsync -a "$mod_dir/system_ext/" "$SYSEXT_DIR/"
            done
          fi

          # دمج ملفات التعديلات والـ overlays من ExtremeXT/ExtremeROM
          if [ -d "$ROOT_DIR/extremerom_src" ]; then
            find "$ROOT_DIR/extremerom_src" -type d -name "overlay" | while read -r ov_dir; do
              sudo rsync -a "$ov_dir/" "$PROD_DIR/overlay/" 2>/dev/null || true
            done
            for mod_dir in "$ROOT_DIR/extremerom_src/mods"/* "$ROOT_DIR/extremerom_src/system" "$ROOT_DIR/extremerom_src/product"; do
              [ -d "$mod_dir/system" ] && sudo rsync -a "$mod_dir/system/" "$SYS_DIR/"
              [ -d "$mod_dir/product" ] && sudo rsync -a "$mod_dir/product/" "$PROD_DIR/"
              [ -d "$mod_dir/system_ext" ] && sudo rsync -a "$mod_dir/system_ext/" "$SYSEXT_DIR/"
            done
          fi

          # تعديل floating_feature.xml لتفعيل الميزات الداعمة
          FF_FILE=$(find "$SYS_DIR" "$PROD_DIR" -name "floating_feature.xml" | head -n 1)
          if [ -n "$FF_FILE" ]; then
            sudo python3 -c "
          import re
          path = '$FF_FILE'
          with open(path, 'r', encoding='utf-8') as f:
              data = f.read()

          features = {
              'SEC_FLOATING_FEATURE_COMMON_SUPPORT_AI_BRIEF': 'TRUE',
              'SEC_FLOATING_FEATURE_GENAI_SUPPORT_IMAGE_CLIPPER': 'TRUE',
              'SEC_FLOATING_FEATURE_GENAI_SUPPORT_OBJECT_ERASER': 'TRUE',
              'SEC_FLOATING_FEATURE_GENAI_SUPPORT_REFLECTION_ERASER': 'TRUE',
              'SEC_FLOATING_FEATURE_GENAI_SUPPORT_SHADOW_ERASER': 'TRUE',
              'SEC_FLOATING_FEATURE_GALLERY_SUPPORT_AI_FEATURES': 'TRUE',
              'SEC_FLOATING_FEATURE_FRAMEWORK_CONFIG_NAVIGATION_BAR_THEME': 'SupportLegacyNavigationBar|SupportForceImmersive',
              'SEC_FLOATING_FEATURE_LAUNCHER_CONFIG_ANIMATION_TYPE': 'HighEnd',
          }

          for tag, val in features.items():
              pattern = f'<{tag}>.*?</{tag}>'
              replacement = f'<{tag}>{val}</{tag}>'
              if re.search(pattern, data):
                  data = re.sub(pattern, replacement, data)
              elif '</SecFloatingFeatureSet>' in data:
                  data = data.replace('</SecFloatingFeatureSet>', f'    {replacement}\n</SecFloatingFeatureSet>')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(data)
          "
          fi

          # ضبط صلاحيات الملفات والمجلدات
          for d in extracted_system extracted_product extracted_system_ext; do
            if [ -d "$d" ]; then
              sudo find "$d" -type d -exec chmod 755 {} +
              sudo find "$d" -type f -exec chmod 644 {} +
              [ -d "$d/bin" ] && sudo chmod -R 755 "$d/bin" || true
              [ -d "$d/system/bin" ] && sudo chmod -R 755 "$d/system/bin" || true
            fi
          done

      - name: Repack Images & Create Final ZIP
        run: |
          cd work
          for part in system product system_ext; do
            if [ -d "extracted_${part}" ]; then
              sudo mkfs.erofs -zlz4hc,9 "rom_extracted/${part}.img" "extracted_${part}"
            fi
          done

          cd rom_extracted
          zip -r0 ../out/BROM_v1.5_a04_UN1CA_ExtremeROM.zip ./*

      - name: Upload to Pixeldrain
        run: |
          curl -T "work/out/BROM_v1.5_a04_UN1CA_ExtremeROM.zip" \
          -u :${{ secrets.PIXELDRAIN_API_KEY }} \
          https://pixeldrain.com/api/file/
